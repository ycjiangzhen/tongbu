name: 镜像上游到rdpwrap.ini仓库
on:
  schedule:
    - cron: '17-57/10 * * * *'   # 每10分钟一次（每小时的17/27/37/47/57分），UTC与北京时间同为整点对齐，首次为北京时间17:17
  workflow_dispatch:         # 支持手动点击立即同步

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆上游sebaxakerhtc/rdpwrap.ini完整镜像
        run: |
          git clone --mirror https://github.com/sebaxakerhtc/rdpwrap.ini.git repo.git

      - name: 删除无法推送的refs/pull引用
        working-directory: repo.git
        run: |
          for ref in $(git for-each-ref --format='%(refname)' refs/pull); do
            git update-ref -d "$ref"
          done

      - name: 推送到你的镜像仓库
        working-directory: repo.git
        run: |
          git push --mirror https://x-access-token:${{ secrets.GH_PAT }}@github.com/ycjiangzhen/rdpwrap.ini.git
